trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:
- task: NodeTool@0
  inputs:
    versionSpec: '20.x'
  displayName: 'Install Node.js'

- script: |
    npm exec --yes --package=tailwindcss@3.4.17 -- tailwindcss -c tailwind.config.cjs -i tailwind-input.css -o assets/tailwind.css --minify
  displayName: 'Build Tailwind CSS'

- script: |
    test -f index.html
    test -f assets/tailwind.css
    echo "Website build verification passed"
  displayName: 'Verify website files'

- task: CopyFiles@2
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)'
    Contents: |
      **/*
      !.git/**/*
    TargetFolder: '$(Build.ArtifactStagingDirectory)/website'
  displayName: 'Prepare website artifact'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/website'
    ArtifactName: 'website'
  displayName: 'Publish website artifact'
  
- task: AzureStaticWebApp@0
  inputs:
    app_location: '/folder-that-does-not-exist'
    output_location: ''
    skip_app_build: true
    azure_static_web_apps_api_token: '$(SWA_DEPLOYMENT_TOKEN)'
  displayName: 'Deploy website to Azure Static Web App'